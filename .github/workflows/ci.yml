name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: install, typecheck, test, eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (all packages)
        run: pnpm test

      # Real firmware stays local (fixtures/README.md). Without those BINs,
      # fixture evaluation and holdout cover only committed synthetic data.
      - name: Detection-quality eval (synthetic fixtures)
        run: pnpm eval

      - name: Detection-quality eval — holdout (anti-overfitting check)
        run: pnpm eval holdout

      # Real-image curve, partial, checksum and exact-layout checks skip without
      # local firmware. Running the command here verifies the CLI path only.
      - name: Real-image acceptance (skips without local firmware)
        run: pnpm eval accept
